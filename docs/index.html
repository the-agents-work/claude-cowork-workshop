<h2 id="level-2-skills--%C4%91%C3%B3ng-g%C3%B3i-chuy%C3%AAn-m%C3%B4n">Level 2: Skills — đóng gói chuyên môn</h2>
<p><strong>Skill = tệp hướng dẫn cho nhiệm vụ lặp lại.</strong></p>
<p>Dùng bằng cách:</p>
<ul>
<li>Gõ <code>/skill-name</code> <em>(vd: <code>/brief</code>, <code>/account-research</code>)</em></li>
<li>Hoặc mô tả tự nhiên — Claude tự tìm skill phù hợp</li>
</ul>
<br />

<h2 id="common-errors--fixes">Common errors + fixes</h2>
<table>

<th>Lỗi</th>
<th>Nguyên nhân</th>
<th>Fix</th>
</tr>

<tbody>
<tr>
<td><em>&quot;Claude can't access my files&quot;</em></td>
<td>Folder chưa grant permission</td>
<td>System Pref → Privacy → Files &amp; Folders → bật Claude</td>
</tr>
<tr>
<td>First launch chậm</td>
<td>Tải sandbox runtime ~1.2GB</td>
<td>Đợi 3-5 phút lần đầu, sau nhanh</td>
</tr>
<tr>
<td>Connector ngắt</td>
<td>OAuth token hết hạn</td>
<td>Customize → Connectors → Re-authorize</td>
</tr>
<tr>
<td>Schedule không chạy</td>
<td>Máy sleep</td>
<td>Settings → Energy Saver → Prevent sleep khi cắm sạc</td>
</tr>
<tr>
<td>Output trống</td>
<td>Prompt scope mơ hồ</td>
<td>Áp dụng Pattern 1: scope chính xác</td>
</tr>
</tbody>

<header>Claude Cowork Workshop · 22/05/2026</header>
<h2 id="qa--c%C3%A2u-hay-%C4%91%C6%B0%E1%BB%A3c-h%E1%BB%8Fi-tr%C6%B0%E1%BB%9Bc">Q&amp;A — câu hay được hỏi trước</h2>
<ul>
<li><em>Cowork có an toàn cho file công ty?</em> → <strong>Sandboxed shell + approval per step.</strong> Folder bạn không grant — Claude không thấy.</li>
<li><em>Có thay được nhân viên?</em> → Thay <strong>việc lặp lại</strong>, không thay <strong>judgment</strong>. Vẫn cần người review output.</li>
<li><em>Bao lâu thì quen?</em> → 2-3 ngày dùng nghiêm túc theo lộ trình 30 ngày.</li>
<li><em>Tiếng Việt có ổn?</em> → OCR + sinh tiếng Việt ổn với tài liệu rõ nguồn. Vẫn review tên riêng/số liệu.</li>
<li><em>Cowork vs Claude Code?</em> → Code cho <strong>dev</strong> (git/build/refactor). Cowork cho <strong>knowledge worker</strong> (Office/email/file/browser).</li>
<li><em>Có dùng được trên Linux?</em> → Chưa. Chỉ Mac + Windows.</li>
</ul>
